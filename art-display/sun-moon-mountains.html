<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>One Day At A Time</title>
    <style>
      :root {
        --ink: #ffffff;
        --paper: #efe6d3;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: var(--paper);
        overflow: hidden;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      svg#art {
        display: block;
        width: 100%;
        height: 100%;
      }
      .chrome {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 20px 28px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: "JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: var(--ink);
        pointer-events: none;
        transition: opacity 200ms ease;
        mix-blend-mode: difference;
      }
      .chrome.hidden {
        opacity: 0;
      }
      .chrome .muted {
        opacity: 0.55;
      }
      .chrome .group {
        display: flex;
        align-items: center;
        gap: 18px;
        pointer-events: auto;
      }
      .hint {
        position: fixed;
        bottom: 18px;
        left: 0;
        right: 0;
        text-align: center;
        font-family: "JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.3em;
        color: var(--ink);
        opacity: 0.4;
        pointer-events: none;
        transition: opacity 200ms ease;
        mix-blend-mode: difference;
      }
      .hint.hidden {
        opacity: 0;
      }
      #debugBar {
        position: fixed;
        bottom: 56px;
        left: 50%;
        transform: translateX(-50%);
        width: min(70vw, 420px);
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: "JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace;
        font-size: 10px;
        color: #fff;
        letter-spacing: 0.12em;
        background: rgba(0, 0, 0, 0.32);
        padding: 8px 14px;
        border-radius: 20px;
        backdrop-filter: blur(4px);
        transition: opacity 200ms ease;
      }
      #debugBar.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #debugBar input[type="range"] {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <svg
        id="art"
        viewBox="0 0 900 1300"
        preserveAspectRatio="xMidYMid slice"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <clipPath id="panelClip">
            <rect x="130" y="150" width="640" height="980" rx="18" />
          </clipPath>
          <filter id="shadowBlur" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="10" />
          </filter>
          <filter
            id="inkWobble"
            x="-20%"
            y="-20%"
            width="140%"
            height="140%"
            color-interpolation-filters="sRGB"
          >
            <feTurbulence
              type="fractalNoise"
              baseFrequency="0.015 0.035"
              numOctaves="2"
              seed="4"
              result="noise"
            >
              <animate
                attributeName="seed"
                values="2;5;8;3;6;2"
                dur="50s"
                repeatCount="indefinite"
              />
            </feTurbulence>
            <feDisplacementMap
              in="SourceGraphic"
              in2="noise"
              scale="6"
              xChannelSelector="R"
              yChannelSelector="G"
            />
          </filter>
        </defs>

        <!-- paper background -->
        <rect x="0" y="0" width="900" height="1300" fill="var(--paper)" />

        <!-- soft card shadow -->
        <rect
          x="140"
          y="166"
          width="640"
          height="980"
          rx="18"
          fill="#000000"
          opacity="0.14"
          filter="url(#shadowBlur)"
        />

        <g clip-path="url(#panelClip)">
          <g filter="url(#inkWobble)">
            <rect id="skyRect" x="130" y="150" width="640" height="568" fill="#e7c15f" />
            <g id="stars"></g>
            <circle id="body" cx="450" cy="700" r="46" fill="#f0c351" stroke="#241a10" stroke-width="5" />
            <rect id="seaRect" x="130" y="704" width="640" height="426" fill="#c2933a" />
          </g>
          <g id="waves" fill="none" stroke="#241a10" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#inkWobble)"></g>
        </g>

        <!-- panel border -->
        <rect
          x="130"
          y="150"
          width="640"
          height="980"
          rx="18"
          fill="none"
          stroke="#241a10"
          stroke-width="8"
        />
      </svg>
    </div>

    <div class="chrome" id="chrome">
      <div class="group">
        <span class="muted">One&nbsp;Day&nbsp;At&nbsp;A&nbsp;Time&nbsp;/&nbsp;</span>
        <span id="clockLabel">00:00</span>
      </div>
      <div class="group"><span id="dateLabel" class="muted"></span></div>
    </div>

    <div id="debugBar" class="hidden">
      <span>00:00</span>
      <input
        id="debugSlider"
        type="range"
        min="0"
        max="1439"
        value="720"
        step="1"
      />
      <span>23:59</span>
    </div>

    <div class="hint" id="hint">Click anywhere to hide controls</div>

    <script>
      (() => {
        "use strict";

        // ─────────────────────────────────────────────────────────────────
        // TIME-OF-DAY MODEL — real wall clock, four anchor states
        // ─────────────────────────────────────────────────────────────────
        const DAY_START = 6;
        const DAY_END = 18;
        const DAY_LEN = DAY_END - DAY_START;
        const NIGHT_LEN = 24 - DAY_LEN;

        const clamp01 = (v) => Math.max(0, Math.min(1, v));
        const lerp = (a, b, t) => a + (b - a) * t;

        function hexToRgb(hex) {
          const n = parseInt(hex.slice(1), 16);
          return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
        }
        function rgbToHex([r, g, b]) {
          const c = (v) =>
            Math.round(Math.max(0, Math.min(255, v)))
              .toString(16)
              .padStart(2, "0");
          return `#${c(r)}${c(g)}${c(b)}`;
        }
        function lerpColor(hexA, hexB, t) {
          const a = hexToRgb(hexA);
          const b = hexToRgb(hexB);
          return rgbToHex([
            lerp(a[0], b[0], t),
            lerp(a[1], b[1], t),
            lerp(a[2], b[2], t),
          ]);
        }

        // The four reference states, smoothly cross-faded across the day.
        const PALETTE_KEYS = [
          { h: 0, sky: "#14171f", sea: "#163640", body: "#f5efe0", night: 1 },
          { h: 6, sky: "#e7c15f", sea: "#c2933a", body: "#f0c351", night: 0 },
          { h: 12, sky: "#8fc9b6", sea: "#1f6d5c", body: "#f0c351", night: 0 },
          { h: 18, sky: "#dd7a34", sea: "#a8461f", body: "#f0c351", night: 0 },
          { h: 24, sky: "#14171f", sea: "#163640", body: "#f5efe0", night: 1 },
        ];

        function paletteAt(hour) {
          let i = 0;
          while (i < PALETTE_KEYS.length - 1 && PALETTE_KEYS[i + 1].h < hour) i++;
          const a = PALETTE_KEYS[i];
          const b = PALETTE_KEYS[Math.min(i + 1, PALETTE_KEYS.length - 1)];
          const span = b.h - a.h || 1;
          const t = clamp01((hour - a.h) / span);
          return {
            sky: lerpColor(a.sky, b.sky, t),
            sea: lerpColor(a.sea, b.sea, t),
            body: lerpColor(a.body, b.body, t),
            night: lerp(a.night, b.night, t),
          };
        }

        // Shared arc used by both the sun and the moon. It dips below the
        // horizon at both ends so the sea panel (drawn on top) clips it
        // into the classic "peeking over the horizon" sliver.
        const ARC_LEFT_X = 190;
        const ARC_RIGHT_X = 710;
        const HORIZON_Y = 718;
        const ARC_BASE_Y = HORIZON_Y + 12; // sea rect overlaps the sky slightly to avoid a wobble seam
        const ARC_PEAK_Y = 240;

        function arcPosition(progress) {
          const p = clamp01(progress);
          const x = lerp(ARC_LEFT_X, ARC_RIGHT_X, p);
          const y = ARC_BASE_Y - (ARC_BASE_Y - ARC_PEAK_Y) * Math.sin(Math.PI * p);
          return { x, y };
        }

        // ─────────────────────────────────────────────────────────────────
        // SEA LINES — animate on their own clock, independent of the
        // real-time sun/moon, and much faster.
        // ─────────────────────────────────────────────────────────────────
        const SEA_TOP = 718;
        const SEA_BOTTOM = 1130;
        const PANEL_LEFT = 130;
        const PANEL_RIGHT = 770;
        const LINE_COUNT = 6;
        const WAVE_OMEGA = (2 * Math.PI) / 22; // one full cycle every 22s
        const K1 = (2 * Math.PI * 2.1) / (PANEL_RIGHT - PANEL_LEFT);
        const K2 = K1 * 2.3;
        const SAMPLE_STEP = 16;

        const wavesGroup = document.getElementById("waves");
        const wavePaths = [];
        for (let i = 0; i < LINE_COUNT; i++) {
          const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
          wavesGroup.appendChild(p);
          wavePaths.push(p);
        }

        function updateWaves(t) {
          const spacing = (SEA_BOTTOM - SEA_TOP) / (LINE_COUNT + 1);
          for (let i = 0; i < LINE_COUNT; i++) {
            const yBase = SEA_TOP + spacing * (i + 1);
            const seed = i * 1.7;
            const phase = t * WAVE_OMEGA;
            let d = "";
            for (let x = PANEL_LEFT; x <= PANEL_RIGHT; x += SAMPLE_STEP) {
              const y =
                yBase +
                9 * Math.sin(K1 * x + phase + seed) +
                4 * Math.sin(K2 * x - phase * 1.3 + seed);
              d += (x === PANEL_LEFT ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1) + " ";
            }
            wavePaths[i].setAttribute("d", d);
          }
        }

        // ─────────────────────────────────────────────────────────────────
        // DOM
        // ─────────────────────────────────────────────────────────────────
        const skyRect = document.getElementById("skyRect");
        const seaRect = document.getElementById("seaRect");
        const body = document.getElementById("body");
        const starsGroup = document.getElementById("stars");
        const clockLabel = document.getElementById("clockLabel");
        const dateLabel = document.getElementById("dateLabel");

        // ─────────────────────────────────────────────────────────────────
        // STARS — each twinkles subtly and slowly fades out/in at a new
        // position, all on independent cycles so the sky feels alive.
        // ─────────────────────────────────────────────────────────────────
        const STAR_COUNT = 10;
        const STAR_X_MIN = 165;
        const STAR_X_MAX = 735;
        const STAR_Y_MIN = 180;
        const STAR_Y_MAX = 685;

        function starHash(n) {
          const x = Math.sin(n * 127.1) * 43758.5453123;
          return x - Math.floor(x);
        }

        const stars = [];
        for (let i = 0; i < STAR_COUNT; i++) {
          const el = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          el.setAttribute("fill", "#f4efe0");
          starsGroup.appendChild(el);
          stars.push({
            el,
            seed: i * 97.7,
            period: 9 + Math.random() * 9,
            phase: Math.random() * 20,
            twinkleSpeed: 2 * Math.PI * (0.5 + Math.random() * 0.7),
            twinkleAmp: 0.12 + Math.random() * 0.18,
            twinklePhase: Math.random() * Math.PI * 2,
            baseOpacity: 0.6 + Math.random() * 0.4,
            radius: 2.2 + Math.random() * 2.3,
          });
        }

        function updateStars(animT, nightFactor) {
          const fadeFrac = 0.3;
          for (const s of stars) {
            const cyclePos = (animT + s.phase) / s.period;
            const cycleIndex = Math.floor(cyclePos);
            const frac = cyclePos - cycleIndex;
            let envelope;
            if (frac < fadeFrac) envelope = frac / fadeFrac;
            else if (frac > 1 - fadeFrac) envelope = (1 - frac) / fadeFrac;
            else envelope = 1;

            const twinkle = 1 + s.twinkleAmp * Math.sin(animT * s.twinkleSpeed + s.twinklePhase);
            const opacity = clamp01(envelope * twinkle) * s.baseOpacity * nightFactor;

            const hx = starHash(s.seed + cycleIndex * 3.7);
            const hy = starHash(s.seed + cycleIndex * 3.7 + 1.234);
            const x = STAR_X_MIN + hx * (STAR_X_MAX - STAR_X_MIN);
            const y = STAR_Y_MIN + hy * (STAR_Y_MAX - STAR_Y_MIN);

            s.el.setAttribute("cx", x.toFixed(1));
            s.el.setAttribute("cy", y.toFixed(1));
            s.el.setAttribute("r", s.radius.toFixed(2));
            s.el.setAttribute("opacity", opacity.toFixed(3));
          }
        }

        function render(date, animT) {
          const hour =
            date.getHours() +
            date.getMinutes() / 60 +
            date.getSeconds() / 3600;

          const p = paletteAt(hour);
          skyRect.setAttribute("fill", p.sky);
          seaRect.setAttribute("fill", p.sea);
          updateStars(animT, p.night);

          const isDay = hour >= DAY_START && hour < DAY_END;
          let progress;
          if (isDay) {
            progress = (hour - DAY_START) / DAY_LEN;
          } else {
            const h = hour < DAY_START ? hour + 24 - DAY_END : hour - DAY_END;
            progress = h / NIGHT_LEN;
          }

          const pos = arcPosition(progress);
          body.setAttribute("cx", pos.x.toFixed(1));
          body.setAttribute("cy", pos.y.toFixed(1));
          body.setAttribute("fill", p.body);

          updateWaves(animT);

          const hh = String(date.getHours()).padStart(2, "0");
          const mm = String(date.getMinutes()).padStart(2, "0");
          clockLabel.textContent = `${hh}:${mm}`;
          dateLabel.textContent = date
            .toLocaleDateString(undefined, {
              weekday: "short",
              month: "short",
              day: "numeric",
            })
            .toUpperCase();
        }

        // ─────────────────────────────────────────────────────────────────
        // CLOCK SOURCE — real time by default; ?debug exposes a scrub bar.
        // ─────────────────────────────────────────────────────────────────
        const debugMode = new URLSearchParams(window.location.search).has(
          "debug",
        );
        let debugMinutes = 12 * 60;

        function currentDate() {
          if (!debugMode) return new Date();
          const d = new Date();
          d.setHours(Math.floor(debugMinutes / 60), debugMinutes % 60, 0, 0);
          return d;
        }

        const start = performance.now();
        function loop(now) {
          render(currentDate(), (now - start) / 1000);
          requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);

        if (debugMode) {
          const debugBar = document.getElementById("debugBar");
          const slider = document.getElementById("debugSlider");
          debugBar.classList.remove("hidden");
          slider.value = String(debugMinutes);
          slider.addEventListener("input", () => {
            debugMinutes = Number(slider.value);
          });
          slider.addEventListener("click", (e) => e.stopPropagation());
        }

        // ─────────────────────────────────────────────────────────────────
        // CHROME
        // ─────────────────────────────────────────────────────────────────
        const chrome = document.getElementById("chrome");
        const hint = document.getElementById("hint");
        const debugBar = document.getElementById("debugBar");

        document.body.addEventListener("click", () => {
          const hidden = chrome.classList.toggle("hidden");
          hint.classList.toggle("hidden", hidden);
          if (debugMode) debugBar.classList.toggle("hidden", hidden);
          if (hidden) {
            if (!document.fullscreenElement) {
              document.documentElement.requestFullscreen?.().catch(() => {});
            }
          } else {
            if (document.fullscreenElement) {
              document.exitFullscreen?.().catch(() => {});
            }
          }
        });

        document.addEventListener("fullscreenchange", () => {
          if (
            !document.fullscreenElement &&
            chrome.classList.contains("hidden")
          ) {
            chrome.classList.remove("hidden");
            hint.classList.remove("hidden");
            if (debugMode) debugBar.classList.remove("hidden");
          }
        });
      })();
    </script>
  </body>
</html>
