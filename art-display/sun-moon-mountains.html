<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Sun &amp; Mountains</title>
    <style>
      :root {
        --ink: #ffffff;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #1b1a35;
        overflow: hidden;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      svg#art {
        display: block;
        width: 100%;
        height: 100%;
      }
      .chrome {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 20px 28px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: "JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: var(--ink);
        pointer-events: none;
        transition: opacity 200ms ease;
        mix-blend-mode: difference;
      }
      .chrome.hidden {
        opacity: 0;
      }
      .chrome .muted {
        opacity: 0.55;
      }
      .chrome .group {
        display: flex;
        align-items: center;
        gap: 18px;
        pointer-events: auto;
      }
      .hint {
        position: fixed;
        bottom: 18px;
        left: 0;
        right: 0;
        text-align: center;
        font-family: "JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.3em;
        color: var(--ink);
        opacity: 0.4;
        pointer-events: none;
        transition: opacity 200ms ease;
        mix-blend-mode: difference;
      }
      .hint.hidden {
        opacity: 0;
      }
      #debugBar {
        position: fixed;
        bottom: 56px;
        left: 50%;
        transform: translateX(-50%);
        width: min(70vw, 420px);
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: "JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace;
        font-size: 10px;
        color: #fff;
        letter-spacing: 0.12em;
        background: rgba(0, 0, 0, 0.32);
        padding: 8px 14px;
        border-radius: 20px;
        backdrop-filter: blur(4px);
        transition: opacity 200ms ease;
      }
      #debugBar.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #debugBar input[type="range"] {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <svg
        id="art"
        viewBox="0 0 1000 1300"
        preserveAspectRatio="xMidYMid slice"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop id="skyStopTop" offset="0%" stop-color="#1b1a35" />
            <stop id="skyStopBottom" offset="100%" stop-color="#262048" />
          </linearGradient>
        </defs>

        <!-- flat gradient sky -->
        <rect x="0" y="0" width="1000" height="1300" fill="url(#sky)" />

        <!-- simple flat stars -->
        <g id="stars"></g>

        <!-- the celestial body: one flat circle plays sun by day, moon by
             night, travelling the same arc either way -->
        <circle id="body" cx="500" cy="800" r="72" fill="#eee3cf" />

        <!-- two-tone flat mountains, far then near -->
        <path
          id="mountainFar"
          d="M0,830 C160,760 300,800 480,750 C650,790 820,730 1000,780 L1000,1300 L0,1300 Z"
          fill="#4b4570"
        />
        <path
          id="mountainNear"
          d="M0,960 C180,880 340,930 520,860 C700,910 860,850 1000,900 L1000,1300 L0,1300 Z"
          fill="#322c54"
        />
      </svg>
    </div>

    <div class="chrome" id="chrome">
      <div class="group">
        <span class="muted">Sun&nbsp;&amp;&nbsp;Mountains&nbsp;/&nbsp;</span>
        <span id="clockLabel">00:00</span>
      </div>
      <div class="group"><span id="dateLabel" class="muted"></span></div>
    </div>

    <div id="debugBar" class="hidden">
      <span>00:00</span>
      <input
        id="debugSlider"
        type="range"
        min="0"
        max="1439"
        value="720"
        step="1"
      />
      <span>23:59</span>
    </div>

    <div class="hint" id="hint">Click anywhere to hide controls</div>

    <script>
      (() => {
        "use strict";

        // ─────────────────────────────────────────────────────────────────
        // TIME-OF-DAY MODEL
        // ─────────────────────────────────────────────────────────────────
        // Sun is up 06:00–18:00, moon 18:00–06:00. Both are rendered with
        // the same single circle, travelling the same arc function — the
        // only thing that changes is which half of the day is active.
        const DAY_START = 6;
        const DAY_END = 18;
        const DAY_LEN = DAY_END - DAY_START;
        const NIGHT_LEN = 24 - DAY_LEN;

        const clamp01 = (v) => Math.max(0, Math.min(1, v));
        const lerp = (a, b, t) => a + (b - a) * t;

        function hexToRgb(hex) {
          const n = parseInt(hex.slice(1), 16);
          return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
        }
        function rgbToHex([r, g, b]) {
          const c = (v) =>
            Math.round(Math.max(0, Math.min(255, v)))
              .toString(16)
              .padStart(2, "0");
          return `#${c(r)}${c(g)}${c(b)}`;
        }
        function lerpColor(hexA, hexB, t) {
          const a = hexToRgb(hexA);
          const b = hexToRgb(hexB);
          return rgbToHex([
            lerp(a[0], b[0], t),
            lerp(a[1], b[1], t),
            lerp(a[2], b[2], t),
          ]);
        }

        // A single flat-color palette across the 24h cycle. `body` covers
        // both the sun (warm, daytime) and the moon (pale, nighttime) —
        // it crossfades smoothly through the sunrise/sunset hours.
        const PALETTE_KEYS = [
          { h: 0, sky0: "#1b1a35", sky1: "#262048", body: "#eee3cf", far: "#4b4570", near: "#322c54", night: 1 },
          { h: 3, sky0: "#1e1c3c", sky1: "#2b2350", body: "#e9dfcb", far: "#4e4772", near: "#342c55", night: 0.97 },
          { h: 5, sky0: "#262041", sky1: "#3a2c52", body: "#e6ddca", far: "#5a4d74", near: "#3a2f58", night: 0.75 },
          { h: 6.2, sky0: "#f6b8c6", sky1: "#f8d2b8", body: "#f6b23a", far: "#e79a7d", near: "#d97a4c", night: 0.22 },
          { h: 9, sky0: "#fbdcae", sky1: "#fdebd2", body: "#f2b93e", far: "#e7ae94", near: "#dd8f66", night: 0.04 },
          { h: 12, sky0: "#fdeec0", sky1: "#fff6df", body: "#e8862f", far: "#e6b8cf", near: "#d98fb0", night: 0 },
          { h: 15, sky0: "#fbdca0", sky1: "#fdead0", body: "#ef9a3a", far: "#e6aa9a", near: "#da8062", night: 0.02 },
          { h: 17.8, sky0: "#f6a8bd", sky1: "#f8c9ab", body: "#ef7a3c", far: "#d97a5c", near: "#b8543a", night: 0.32 },
          { h: 19.5, sky0: "#4a3766", sky1: "#5c3f66", body: "#e7dcc9", far: "#6a4f75", near: "#4a3358", night: 0.68 },
          { h: 21, sky0: "#26223f", sky1: "#332752", body: "#eadfcb", far: "#524a70", near: "#362d55", night: 0.88 },
          { h: 24, sky0: "#1b1a35", sky1: "#262048", body: "#eee3cf", far: "#4b4570", near: "#322c54", night: 1 },
        ];

        function paletteAt(hour) {
          let i = 0;
          while (i < PALETTE_KEYS.length - 1 && PALETTE_KEYS[i + 1].h < hour) i++;
          const a = PALETTE_KEYS[i];
          const b = PALETTE_KEYS[Math.min(i + 1, PALETTE_KEYS.length - 1)];
          const span = b.h - a.h || 1;
          const t = clamp01((hour - a.h) / span);
          return {
            sky0: lerpColor(a.sky0, b.sky0, t),
            sky1: lerpColor(a.sky1, b.sky1, t),
            body: lerpColor(a.body, b.body, t),
            far: lerpColor(a.far, b.far, t),
            near: lerpColor(a.near, b.near, t),
            night: lerp(a.night, b.night, t),
          };
        }

        // Fade the body in/out near the horizon edges of its visible window.
        function edgeFade(progress) {
          if (progress <= 0 || progress >= 1) return 0;
          const fade = 0.06;
          return clamp01(
            Math.min(progress / fade, (1 - progress) / fade, 1),
          );
        }

        // Shared arc used by both the sun and the moon.
        const ARC_LEFT_X = 120;
        const ARC_RIGHT_X = 880;
        const ARC_BASE_Y = 800;
        const ARC_PEAK_Y = 260;

        function arcPosition(progress) {
          const p = clamp01(progress);
          const x = lerp(ARC_LEFT_X, ARC_RIGHT_X, p);
          const y = ARC_BASE_Y - (ARC_BASE_Y - ARC_PEAK_Y) * Math.sin(Math.PI * p);
          return { x, y };
        }

        // ─────────────────────────────────────────────────────────────────
        // DOM
        // ─────────────────────────────────────────────────────────────────
        const skyStopTop = document.getElementById("skyStopTop");
        const skyStopBottom = document.getElementById("skyStopBottom");
        const mountainFar = document.getElementById("mountainFar");
        const mountainNear = document.getElementById("mountainNear");
        const body = document.getElementById("body");
        const starsGroup = document.getElementById("stars");
        const clockLabel = document.getElementById("clockLabel");
        const dateLabel = document.getElementById("dateLabel");

        // Scatter a fixed field of simple flat-dot stars once.
        (() => {
          let seed = 42;
          const rand = () => {
            seed = (seed * 1103515245 + 12345) & 0x7fffffff;
            return (seed / 0x7fffffff) % 1;
          };
          const frag = document.createDocumentFragment();
          for (let i = 0; i < 45; i++) {
            const c = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "circle",
            );
            c.setAttribute("cx", (rand() * 1000).toFixed(1));
            c.setAttribute("cy", (rand() * 620).toFixed(1));
            c.setAttribute("r", (1.4 + rand() * 2).toFixed(2));
            c.setAttribute("fill", "#f4efe0");
            c.setAttribute("opacity", (0.4 + rand() * 0.5).toFixed(2));
            frag.appendChild(c);
          }
          starsGroup.appendChild(frag);
        })();

        function render(date) {
          const hour =
            date.getHours() +
            date.getMinutes() / 60 +
            date.getSeconds() / 3600;

          const p = paletteAt(hour);
          skyStopTop.setAttribute("stop-color", p.sky0);
          skyStopBottom.setAttribute("stop-color", p.sky1);
          mountainFar.setAttribute("fill", p.far);
          mountainNear.setAttribute("fill", p.near);
          starsGroup.setAttribute("opacity", p.night.toFixed(3));

          const isDay = hour >= DAY_START && hour < DAY_END;
          let progress;
          if (isDay) {
            progress = (hour - DAY_START) / DAY_LEN;
          } else {
            const h = hour < DAY_START ? hour + 24 - DAY_END : hour - DAY_END;
            progress = h / NIGHT_LEN;
          }

          const pos = arcPosition(progress);
          const opacity = edgeFade(progress);
          body.setAttribute("cx", pos.x.toFixed(1));
          body.setAttribute("cy", pos.y.toFixed(1));
          body.setAttribute("fill", p.body);
          body.setAttribute("opacity", opacity.toFixed(3));

          const hh = String(date.getHours()).padStart(2, "0");
          const mm = String(date.getMinutes()).padStart(2, "0");
          clockLabel.textContent = `${hh}:${mm}`;
          dateLabel.textContent = date
            .toLocaleDateString(undefined, {
              weekday: "short",
              month: "short",
              day: "numeric",
            })
            .toUpperCase();
        }

        // ─────────────────────────────────────────────────────────────────
        // CLOCK SOURCE — real time by default; ?debug exposes a scrub bar.
        // ─────────────────────────────────────────────────────────────────
        const debugMode = new URLSearchParams(window.location.search).has(
          "debug",
        );
        let debugMinutes = 12 * 60;

        function currentDate() {
          if (!debugMode) return new Date();
          const d = new Date();
          d.setHours(Math.floor(debugMinutes / 60), debugMinutes % 60, 0, 0);
          return d;
        }

        function loop() {
          render(currentDate());
          requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);

        if (debugMode) {
          const debugBar = document.getElementById("debugBar");
          const slider = document.getElementById("debugSlider");
          debugBar.classList.remove("hidden");
          slider.value = String(debugMinutes);
          slider.addEventListener("input", () => {
            debugMinutes = Number(slider.value);
          });
          slider.addEventListener("click", (e) => e.stopPropagation());
        }

        // ─────────────────────────────────────────────────────────────────
        // CHROME
        // ─────────────────────────────────────────────────────────────────
        const chrome = document.getElementById("chrome");
        const hint = document.getElementById("hint");
        const debugBar = document.getElementById("debugBar");

        document.body.addEventListener("click", () => {
          const hidden = chrome.classList.toggle("hidden");
          hint.classList.toggle("hidden", hidden);
          if (debugMode) debugBar.classList.toggle("hidden", hidden);
          if (hidden) {
            if (!document.fullscreenElement) {
              document.documentElement.requestFullscreen?.().catch(() => {});
            }
          } else {
            if (document.fullscreenElement) {
              document.exitFullscreen?.().catch(() => {});
            }
          }
        });

        document.addEventListener("fullscreenchange", () => {
          if (
            !document.fullscreenElement &&
            chrome.classList.contains("hidden")
          ) {
            chrome.classList.remove("hidden");
            hint.classList.remove("hidden");
            if (debugMode) debugBar.classList.remove("hidden");
          }
        });
      })();
    </script>
  </body>
</html>
